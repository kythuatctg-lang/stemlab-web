# Cấu hình Cloudflare Pages
# Deploy:  npx wrangler pages deploy
name = "stemlab-web"
compatibility_date = "2026-07-01"
pages_build_output_dir = "public"

# --- KV lưu cấu hình do trang /admin chỉnh sửa ---
# Tạo namespace "SETTINGS" trong Cloudflare Dashboard (Workers & Pages → KV → Create),
# copy Namespace ID rồi dán vào chỗ PASTE_KV_ID_HERE bên dưới, sau đó commit lại.
[[kv_namespaces]]
binding = "SETTINGS"
id = "PASTE_KV_ID_HERE"
